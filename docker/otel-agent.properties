# EDOT Java agent 설정(docs LOG_SCHEMA.md 7절 "추적 엔진"·"계측 범위"). 이미지의 /app/otel-agent.properties가 되고,
# 시작 스크립트(docker/entrypoint.sh)가 -Dotel.javaagent.configuration-file로 넘긴다.
# 환경 변수(OTEL_*)가 이 파일보다 먼저다. 그래서 여기에는 어디서 돌아도 안전한 기본값을 두고, 환경마다 다른 것(전송 켜기,
# 보낼 곳, resource의 환경·파드 이름)은 gitops overlay의 환경 변수가 정한다. agent가 이 파일보다 먼저 읽는 값(agent 로그,
# DB 안정 속성 이름)은 시작 스크립트의 -D에 있다.

# 서비스 이름. Kubernetes 이름이고 로그의 service.name과 같다(spring.application.name인 content와 다르다)
otel.service.name=content-api

# 기본은 보내지 않는다(prod 포함). dev overlay가 OTEL_TRACES_EXPORTER=otlp·OTEL_METRICS_EXPORTER=otlp로 켠다. 꺼 두어도
# trace ID는 만들어지고 전파된다. 지표는 켜면 trace와 같은 collector로 가서 ES metrics-*.otel-*에 쌓인다(docs ALERTING.md 7절).
# 로그는 stdout → Filebeat가 모으므로 OTLP로는 보내지 않는다
otel.traces.exporter=none
otel.metrics.exporter=none
otel.logs.exporter=none

# W3C traceparent만 읽고 쓴다. baggage는 쓰지 않는다. 우리 서비스는 tracestate를 만들지 않는다(아래 sampler)
otel.propagators=tracecontext

# sampler는 표준 parentbased_always_on이다(부모가 있으면 부모의 결정을 따르고, root는 모두 남긴다. dev 100%, LOG_SCHEMA.md 7절
# "span 저장"). EDOT 기본 sampler는 root span 문맥에 tracestate(ot=th:0)를 넣고, 그 값이 HTTP·Kafka 헤더로 모든 내부 서비스에
# 전파된다. 우리 규약은 traceparent 하나다. Python 서비스의 시작 스크립트와 같은 값이다
otel.traces.sampler=parentbased_always_on

# EDOT가 5ms보다 긴 span마다 붙이는 호출 스택(code.stacktrace)은 끈다. 원인 경로는 로그의 error.stack_trace로 본다
elastic.otel.java.span.stacktrace.min.duration=-1

# 계측은 기본을 모두 끄고 이 서비스가 쓰는 라이브러리만 켠다. 새 라이브러리·의존 대상을 쓰면 여기와 LOG_SCHEMA.md 계측 범위 표에 함께 더한다.
# 빠진 대상은 gitops logging/tools/apm_consistency.py의 C6이 잡는다
otel.instrumentation.common.default-enabled=false
# 로깅 팩토리가 OpenTelemetry API로 연 span·읽은 지금 span을 agent에 잇는다(없으면 앱의 API 호출이 아무것도 하지 않는다)
otel.instrumentation.opentelemetry-api.enabled=true
# 요청 받기: Tomcat이 서버 span을 열고(gateway가 보낸 traceparent를 잇는다) Spring MVC가 이름에 경로 템플릿(http.route)을 넣는다
otel.instrumentation.tomcat.enabled=true
otel.instrumentation.servlet.enabled=true
otel.instrumentation.spring-webmvc.enabled=true
# PostgreSQL 쿼리. DataSource.getConnection span(jdbc-datasource)은 켜지 않는다
otel.instrumentation.jdbc.enabled=true
# S3(최신화 입력·결과, 이미지)와 KMS(원고 키). SDK 안의 HTTP 클라이언트 계측은 켜지 않아 호출마다 span이 하나다.
# span의 주소에 든 S3 객체 키는 collector가 지운다
otel.instrumentation.aws-sdk.enabled=true
# Kafka 발행(outbox relay, DLQ)과 소비. 발행 계측은 보내는 순간의 지금 문맥으로 traceparent 헤더를 넣는다(같은 이름의 헤더는 지우고
# 다시 넣는다). 소비는 Spring Kafka 계측이 레코드마다 헤더를 이어 span을 연다(kafka-clients는 소비 계측도 함께 켜야 동작한다)
otel.instrumentation.kafka-clients.enabled=true
otel.instrumentation.spring-kafka.enabled=true
# @Scheduled 회차(outbox relay·purge, inbox purge, 최신화 timeout)마다 span을 연다. 빈 회차는 LogFlow.polling이 표시를 달아
# collector가 버린다
otel.instrumentation.spring-scheduling.enabled=true
# 실행기로 일을 넘길 때 문맥을 함께 넘긴다
otel.instrumentation.executors.enabled=true

# 지표(docs ALERTING.md 7절). 위 계측(Tomcat·JDBC·aws-sdk·kafka-clients·spring-kafka)은 지표 전송을 켜면 요청 지연
# (http.server.request.duration), DB 호출 지연(db.client.operation.duration), Kafka 발행 지연(messaging.client.operation.duration)·
# 레코드 처리 시간(messaging.process.duration)과 Kafka 클라이언트 지표를 함께 낸다. aws-sdk 계측은 S3·KMS 호출에 지표를 내지 않아
# 그 지연은 span으로 본다. Kafka 소비 지연(loresentry.kafka.consume.delay)과 outbox 밀림(loresentry.outbox.*)은 로깅 팩토리가
# OpenTelemetry API로 직접 낸다. 아래는 지표만 내는 계측이다(span은 만들지 않는다)
# JVM: 메모리 영역별 사용량·GC 직후 사용량·최대치, GC 시간, 스레드, 클래스, CPU
otel.instrumentation.runtime-telemetry.enabled=true
# JVM 실험 지표: heap 밖 direct buffer 메모리(Kafka client, AWS SDK), 시스템 CPU, 파일 디스크립터. 컨테이너 메모리와 heap의
# 차이가 어디서 오는지 본다
otel.instrumentation.runtime-telemetry.emit-experimental-metrics=true
# 동시에 처리 중인 요청 수(http.server.active_requests). 요청은 가상 스레드로 처리해(spring.threads.virtual.enabled) Tomcat
# 스레드 풀이 없으므로, 막힘은 이 값으로 본다. 함께 나오는 요청·응답 본문 크기 histogram은 collector가 버린다
otel.instrumentation.http.server.emit-experimental-telemetry=true
# DB 연결 풀(HikariCP): 사용 중·쉬는 연결 수, 최대치, 연결을 기다리는 요청 수, 기다린 시간
otel.instrumentation.hikaricp.enabled=true
