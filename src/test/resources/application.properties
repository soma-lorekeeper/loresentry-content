spring.flyway.enabled=false
media.bucket=test-media-bucket
media.region=ap-northeast-2
media.public-base-url=https://media.test.invalid
# 테스트에서는 relay 를 끈다. 뒤에서 돌면 테스트가 넣은 outbox 행을 먼저 가져가 버린다.
# relay 자체를 확인하는 OutboxRelayEnabledTest 만 이 값을 켠다.
kafka.producer.relay.enabled=false
# 테스트에서는 listener 도 끈다. 기본값(켜짐)이나 개발 PC 의 환경 변수와 상관없이 돌지 않게 적어 둔다.
# 켜 두면 broker 가 없는 테스트 내내 localhost:9092 에 붙으려 한다. listener 를 확인하는 InboxListenerTest 만 켠다.
kafka.consumer.enabled.graph-refresh-completed=false
kafka.consumer.enabled.user-deleted=false
# 시간 제한 확인 작업도 끈다. 뒤에서 돌면 테스트가 일부러 오래된 것처럼 만든 run 을 먼저 실패시킬 수 있다.
# 시간 제한을 확인하는 테스트는 서비스를 직접 부른다.
graph-refresh.timeout-check-enabled=false
manuscript.local-master-key=000102030405060708090a0b0c0d0e0f101112131415161718191a1b1c1d1e1f
# 테스트에는 EDOT Java agent가 없다. agent의 Kafka 발행 계측처럼 보내는 순간의 지금 문맥으로 traceparent 헤더를 넣는다
# (support/AgentLikeTracing). 운영과 같이 outbox 행·DLQ를 그 대상의 범위 안에서 보내야 헤더가 원래 trace를 잇는다.
spring.kafka.producer.properties.interceptor.classes=com.loresentry.content.support.AgentLikeTracing$TraceparentInjector
