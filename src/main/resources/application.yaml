spring:
  application:
    name: content
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content}
    username: ${DB_USERNAME:content_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:content}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.request.size: 4194304
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        group.protocol: consumer

server:
  port: 8000
  shutdown: graceful

media:
  bucket: ${MEDIA_BUCKET:}
  region: ${MEDIA_REGION:ap-northeast-2}
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  upload-url-ttl: 5m
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif

kafka:
  consumer:
    groups:
      graph-refresh-completed: content.graph-refresh-completed
      user-deleted: content.user-deleted
