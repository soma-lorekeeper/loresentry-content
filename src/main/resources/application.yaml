spring:
  application:
    name: content
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content}
    username: ${DB_USERNAME:content_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:content}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.request.size: 4194304
        # send() 가 broker 정보나 버퍼의 빈자리를 기다리는 최대 시간. broker 에 닿지 못하면 여기서 실패한다.
        max.block.ms: 5000
        # 요청 하나를 보내고 broker 의 응답을 기다리는 최대 시간. 넘으면 다시 보낸다.
        request.timeout.ms: 10000
        # send() 가 돌아온 뒤 성공이나 실패가 확정되기까지의 최대 시간(재시도 포함).
        # OutboxPublisher 가 결과를 기다리는 25초보다 짧아야 한다.
        delivery.timeout.ms: 20000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        group.protocol: consumer

server:
  port: 8000
  shutdown: graceful

media:
  bucket: ${MEDIA_BUCKET:}
  region: ${MEDIA_REGION:ap-northeast-2}
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  upload-url-ttl: 5m
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif

kafka:
  consumer:
    groups:
      graph-refresh-completed: content.graph-refresh-completed
      user-deleted: content.user-deleted
  producer:
    relay:
      # relay 를 돌릴지. false 면 이벤트가 outbox 에 쌓이기만 하고 Kafka 로 나가지 않는다.
      # 급히 멈춰야 할 때 Deployment 에 KAFKA_PRODUCER_RELAY_ENABLED=false 를 넣으면 재배포 없이 끌 수 있다.
      enabled: ${KAFKA_PRODUCER_RELAY_ENABLED:true}
