spring:
  application:
    name: content
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content}
    username: ${DB_USERNAME:content_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    client-id: ${KAFKA_CLIENT_ID:content}
    admin:
      auto-create: false
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      compression-type: zstd
      properties:
        enable.idempotence: true
        max.request.size: 4194304
        # send() 가 broker 정보나 버퍼의 빈자리를 기다리는 최대 시간. broker 에 닿지 못하면 여기서 실패한다.
        max.block.ms: 5000
        # 요청 하나를 보내고 broker 의 응답을 기다리는 최대 시간. 넘으면 다시 보낸다.
        request.timeout.ms: 10000
        # send() 가 돌아온 뒤 성공이나 실패가 확정되기까지의 최대 시간(재시도 포함).
        # OutboxPublisher 가 결과를 기다리는 25초보다 짧아야 한다.
        delivery.timeout.ms: 20000
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # poll 한 번에 받는 메시지 수. 처리 시간을 잰 뒤 조정한다. 한 묶음(이 수 × 한 건의 최대 처리 시간)이
      # max.poll.interval.ms(기본 5분)의 70~80% 안에 들어야 한다. 넘기면 Kafka 가 이 consumer 를 죽은 것으로 보고
      # partition 을 넘겨, 같은 묶음을 다시 받는다. 한 건의 처리 시간은 종료 예산(pod 30초)보다도 충분히 짧아야 한다.
      max-poll-records: 10
      properties:
        group.protocol: consumer
    listener:
      # poll 로 받은 묶음을 다 처리한 뒤 offset 을 한 번 commit 한다. 도중에 죽으면 묶음을 다시 받고, 이미 처리한
      # 메시지는 inbox 의 처리 기록이 거른다.
      ack-mode: batch
      # listener 하나가 띄우는 consumer(thread) 수. listener 둘 × 1 이라 DB connection 을 동시에 많아야 2개 쓴다(pool 5개).
      concurrency: 1
      # 종료 신호를 받으면 처리 중인 메시지 하나만 끝내고 멈춘다. 남은 메시지는 처리하지 않았으므로 다음 pod 가 받는다.
      # pod 가 강제 종료되기까지의 30초를 HTTP 요청 마무리에 남기기 위해서다.
      immediate-stop: true

server:
  port: 8000
  shutdown: graceful

media:
  bucket: ${MEDIA_BUCKET:}
  region: ${MEDIA_REGION:ap-northeast-2}
  public-base-url: ${MEDIA_PUBLIC_BASE_URL:}
  upload-url-ttl: 5m
  max-size-bytes: 10485760
  allowed-content-types:
    - image/png
    - image/jpeg
    - image/webp
    - image/gif

kafka:
  consumer:
    topics:
      # 받는 topic. 보내는 서비스와 정한 계약(팀 Kafka 설계 문서의 "Message 계약")의 일부다.
      # 바꿀 때는 inbox 의 InboxMessages 가 검사하는 ce_source 와 payload 모양도 그 topic 의 계약에 맞는지 함께 본다.
      graph-refresh-completed: graph-rag.graph-refresh.completed.v1
      user-deleted: auth.user.deleted.v1
    groups:
      # consumer group id, listener id, inbox 처리 기록의 consumer_name 에 함께 쓴다.
      # 바꾸면 이전 inbox 기록과 이어지지 않아, topic 에 남은 메시지를 처음 받은 것처럼 다시 처리한다.
      graph-refresh-completed: content.graph-refresh-completed
      user-deleted: content.user-deleted
    enabled:
      # listener 를 돌릴지. 꺼 둔 동안의 메시지는 topic 에 남는다.
      # graph-refresh-completed 는 처리 로직이 들어오는 commit 에서 true 로 바꾼다.
      graph-refresh-completed: ${KAFKA_CONSUMER_GRAPH_REFRESH_COMPLETED_ENABLED:false}
      # 회원 탈퇴가 content 에 들어오는 유일한 길이라 기본으로 켠다. 끄면 탈퇴한 사용자의 데이터가 지워지지 않고 남는다.
      user-deleted: ${KAFKA_CONSUMER_USER_DELETED_ENABLED:true}
  producer:
    relay:
      # relay 를 돌릴지. false 면 이벤트가 outbox 에 쌓이기만 하고 Kafka 로 나가지 않는다.
      # 급히 멈춰야 할 때 Deployment 에 KAFKA_PRODUCER_RELAY_ENABLED=false 를 넣으면 재배포 없이 끌 수 있다.
      enabled: ${KAFKA_PRODUCER_RELAY_ENABLED:true}

graph-refresh:
  # 그래프 최신화 입력(refresh/{project}/{request}/input.json)을 올리는 private S3 bucket. 미디어 bucket 과 다르다.
  # graph-rag 가 같은 값을 입력 bucket 으로 쓰므로 둘은 한 ConfigMap 에서 받는다. 비어 있으면 최신화 요청은 503 이다.
  bucket: ${GRAPHRAG_S3_BUCKET:}
