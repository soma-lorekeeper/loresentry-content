spring:
  application:
    name: content
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:content}
    username: ${DB_USERNAME:content_svc}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 1
      connection-timeout: 3000
      validation-timeout: 2000
      initialization-fail-timeout: -1

server:
  port: 8000
  shutdown: graceful
