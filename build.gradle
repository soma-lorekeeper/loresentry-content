plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.loresentry'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

configurations {
	// 이미지에 넣을 EDOT Java agent jar. 앱 classpath와 따로 두고, jar 하나만 받는다(의존성을 따라가지 않는다)
	otelAgent {
		transitive = false
	}
}

dependencies {
	implementation platform('software.amazon.awssdk:bom:2.46.7')
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'software.amazon.awssdk:s3'
	implementation 'software.amazon.awssdk:kms'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	// span을 만들고 잇는 일은 EDOT Java agent가 한다(LOG_SCHEMA.md 7절). 앱은 로깅 팩토리(logging 패키지)가 지금 span을 읽고
	// 우리 span(외부 호출 감싸기, 작업, outbox 행, Kafka 에러 처리)을 열 때 쓰는 OpenTelemetry API만 둔다. 실행 중에는 agent가 이 API를
	// 자기 SDK에 잇는다. 버전은 Spring Boot가 관리한다
	implementation 'io.opentelemetry:opentelemetry-api'
	testImplementation 'org.springframework.boot:spring-boot-starter-kafka-test'
	// 로그는 AppLogger로만 찍는다는 규칙(LOG_SCHEMA.md 5절)을 테스트로 강제한다
	testImplementation 'com.tngtech.archunit:archunit-junit5:1.5.0'
	testImplementation 'org.testcontainers:testcontainers-kafka'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.testcontainers:testcontainers-junit-jupiter'
	testImplementation 'org.testcontainers:testcontainers-postgresql'
	// 테스트에는 agent가 없다. 로깅 팩토리가 연 span과 지금 span 규칙은 OpenTelemetry SDK의 시험용 tracer로 확인한다
	testImplementation 'io.opentelemetry:opentelemetry-sdk'
	testImplementation 'io.opentelemetry:opentelemetry-sdk-testing'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	// 이미지에 넣는 EDOT Java agent. 앱 classpath에는 들어가지 않고 otelAgentJar가 build/otel/otel-agent.jar로 꺼낸다
	otelAgent 'co.elastic.otel:elastic-otel-javaagent:1.14.0'
}

// Dockerfile이 bootJar와 함께 부른다. 이름을 고정해 두어 Dockerfile과 시작 스크립트가 버전을 몰라도 된다
tasks.register('otelAgentJar', Copy) {
	from configurations.otelAgent
	into layout.buildDirectory.dir('otel')
	rename { 'otel-agent.jar' }
}

tasks.named('test') {
	useJUnitPlatform()
}
